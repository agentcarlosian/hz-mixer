name: Feature request
description: Propose a focused improvement to the browser audio mixer.
title: "[Feature] "
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow or problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change and alternatives
      description: Keep browser-local audio processing and both static web and portable builds in mind. This project does not promise clinical effects or specific mental states.
    validations:
      required: true
